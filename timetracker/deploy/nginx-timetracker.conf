# nginx site for Timesheets. The installer fills in __DOMAIN__, __APP_DIR__ and __SOCKET__.
# nginx ignores .htaccess files, so everything private is blocked here instead:
# only the app's own PHP entry points and its assets are reachable.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Let's Encrypt renewals, then send everything else to HTTPS.
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TimesheetsSSL:1m;
    ssl_session_timeout 1d;

    root __APP_DIR__;
    index index.php;
    client_max_body_size 1m;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Private files and folders: config, data, code libraries, deployment files, dotfiles.
    location ~ /\.                                   { return 404; }
    location ~ ^/(lib|data|deploy)(/|$)              { return 404; }
    location ~ \.(sqlite|db|log|md|sh|bat|conf|bak)$ { return 404; }

    # Static assets (CSS/JS), cached by the browser; the app adds ?v= on each release.
    location ^~ /assets/ {
        location ~ \.php$ { return 404; }
        expires 7d;
        access_log off;
    }

    # Only these PHP files may run. Anything else ending in .php (config.php,
    # router.php, lib/*.php) is refused.
    location ~ ^/(index|api|auth|login|invoice|report|backup)\.php$ {
        try_files $uri =404;
        fastcgi_pass unix:__SOCKET__;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 60s;
    }
    location ~ \.php$ { return 404; }

    # "/" is served by index.php via the index directive above.
    location / { try_files $uri $uri/ =404; }
}

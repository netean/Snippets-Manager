; PHP-FPM pool for Timesheets, tuned for a small (1 GB, 1 CPU) server.
; "ondemand" means no PHP processes run while nobody is using the app: one is started
; when a page is requested and exits again after 10 idle seconds. Each uses ~15–25 MB.
[timetracker]
user = timetracker
group = timetracker
listen = /run/php-fpm/timetracker.sock
listen.owner = nginx
listen.group = nginx
listen.mode = 0660

pm = ondemand
pm.max_children = 2
pm.process_idle_timeout = 10s
pm.max_requests = 200

; Plenty for this app; stops a runaway request eating the server's memory.
php_admin_value[memory_limit] = 64M
php_admin_value[max_execution_time] = 60
php_admin_value[upload_max_filesize] = 1M
php_admin_value[post_max_size] = 2M
php_admin_flag[expose_php] = off
php_admin_flag[display_errors] = off
php_admin_value[error_log] = __DATA_DIR__/php-errors.log
php_admin_flag[log_errors] = on
; Only the app and its data folder are reachable from PHP.
php_admin_value[open_basedir] = __APP_DIR__:__DATA_DIR__:/tmp:/usr/share/php
php_admin_value[session.save_path] = __DATA_DIR__/sessions
php_admin_value[upload_tmp_dir] = /tmp

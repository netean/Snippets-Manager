name: Release

# Pushing a version tag (for example 2.1 or 2.1.1) builds, tests and publishes
# a GitHub release with the AppImage and the Arch, Fedora and Debian/Ubuntu
# packages. Before tagging:
#   - set the version in CMakeLists.txt: project(SnippetManager VERSION x.y ...)
#   - add a "## x.y" section to CHANGELOG.md (it becomes the release notes)
#
# Pull requests that change the release process run everything as a
# rehearsal, without publishing; so can "Run workflow" on the Actions tab.

on:
  push:
    tags: ['[0-9]+.[0-9]+', '[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/build.yml'
      - 'packaging/**'
      - 'package-appimage.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  prepare:
    name: Check the version and changelog
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the version and changelog
        id: check
        run: |
          project=$(sed -n 's/^project(.*VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt)
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="$GITHUB_REF_NAME"
            publish=true
            if [[ "$version" != "$project" ]]; then
              echo "::error::The tag is $version, but CMakeLists.txt says VERSION $project. Set the version in CMakeLists.txt, then tag that commit."
              exit 1
            fi
          else
            version="$project"
            publish=false
            echo "::notice::Rehearsal of release $version: everything is built and tested, nothing is published."
          fi
          # The release notes are the CHANGELOG section for this version
          awk -v heading="## $version" '$0 == heading {found=1; next} /^## / {found=0} found' CHANGELOG.md > changes.md
          if [[ ! -s changes.md ]]; then
            echo "::error::CHANGELOG.md has no \"## $version\" section. Add one; it becomes the release notes."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - name: Make the source archive
        run: |
          version="${{ steps.check.outputs.version }}"
          git archive --prefix="Snippets-Manager-$version/" -o "snippets-manager-$version.tar.gz" HEAD
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-source
          path: |
            changes.md
            snippets-manager-*.tar.gz

  test:
    name: Build and test
    needs: prepare
    # The usual checks on Linux, Windows and macOS; this also builds the AppImage
    uses: ./.github/workflows/build.yml

  packages:
    name: Arch, Fedora and Debian/Ubuntu packages
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-source
      - name: Build the packages
        # Each is built and tested in a clean container, then installed in a fresh one
        run: |
          version="${{ needs.prepare.outputs.version }}"
          packaging/build-packages.sh --version "$version" --source "snippets-manager-$version.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: |
            dist/*.pkg.tar.zst
            dist/*.rpm
            dist/*.deb
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [prepare, test, packages]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Write the release notes
        run: |
          version="${{ needs.prepare.outputs.version }}"
          {
            cat artifacts/release-source/changes.md
            echo
            echo "### Packages"
            echo "| Distro | Install |"
            echo "|---|---|"
            echo "| Arch, CachyOS, EndeavourOS, Manjaro | \`sudo pacman -U snippets-manager-$version-1-x86_64.pkg.tar.zst\`, or from the AUR: \`paru -S snippets-manager\` |"
            echo "| Fedora | \`sudo dnf install ./snippets-manager-$version-1.*.x86_64.rpm\` |"
            echo "| Ubuntu 24.04+, Debian 13 | \`sudo apt install ./snippets-manager_${version}-1_amd64.deb\` |"
            echo "| Any other distro | Download the AppImage, make it executable (\`chmod +x\`) and run it. Needs glibc 2.39 or newer. |"
            echo
            echo "\`SHA256SUMS.txt\` lets you check the downloads: \`sha256sum -c --ignore-missing SHA256SUMS.txt\`."
          } > notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ needs.prepare.outputs.version }}"
          mkdir upload
          cp artifacts/SnippetManager-AppImage/*.AppImage artifacts/packages/* upload/
          (cd upload && sha256sum -- * > SHA256SUMS.txt)
          # Only releases from main become "Latest" (not, say, a 1.x fix)
          latest=false
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then latest=true; fi
          gh release create "$version" upload/* \
            --verify-tag \
            --title "Snippet Manager $version" \
            --notes-file notes.md \
            --latest="$latest"

  aur:
    name: Update the AUR package
    needs: [prepare, release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # to attach the AUR files to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Update the PKGBUILD for this release
        run: |
          version="${{ needs.prepare.outputs.version }}"
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/$version.tar.gz"
          sha256=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)
          old=$(bash -c 'source packaging/arch/PKGBUILD; echo "${sha256sums[0]}"')
          mkdir aur
          sed -e "s/^pkgver=.*/pkgver=$version/" -e "s/^pkgrel=.*/pkgrel=1/" -e "s/'$old'/'$sha256'/" \
            packaging/arch/PKGBUILD > aur/PKGBUILD
          # .SRCINFO is generated by makepkg, which runs on Arch
          docker run --rm -v "$PWD/aur:/aur" docker.io/library/archlinux:latest bash -c '
            useradd -m builder && chown -R builder /aur
            su builder -c "cd /aur && makepkg --printsrcinfo > .SRCINFO"
            chown -R '"$(id -u):$(id -g)"' /aur'
          cat aur/PKGBUILD
      - name: Attach the AUR files to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ needs.prepare.outputs.version }}"
          tar -czf "snippets-manager-aur-$version.tar.gz" -C aur PKGBUILD .SRCINFO
          gh release upload "$version" "snippets-manager-aur-$version.tar.gz" --repo "$GITHUB_REPOSITORY"
      - name: Push to the AUR
        # Only once an AUR SSH key has been added as the AUR_SSH_PRIVATE_KEY secret
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [[ -z "$AUR_SSH_PRIVATE_KEY" ]]; then
            echo "::notice::No AUR_SSH_PRIVATE_KEY secret, so the AUR wasn't updated. The new PKGBUILD and .SRCINFO are attached to the release as snippets-manager-aur-$version.tar.gz."
            exit 0
          fi
          version="${{ needs.prepare.outputs.version }}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur && chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes"
          git clone ssh://aur@aur.archlinux.org/snippets-manager.git aur-repo
          cp aur/PKGBUILD aur/.SRCINFO aur-repo/
          cd aur-repo
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "::notice::The AUR package is already up to date."
            exit 0
          fi
          git -c user.name="Iain" -c user.email="850557+netean@users.noreply.github.com" commit -m "Update to $version"
          git push origin HEAD:master
